name: Validate Kubernetes Manifests

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate YAML
        run: |
          echo "Validating Kubernetes manifests..."
          cat deployment.yaml
          cat service.yaml

      - name: Success
        run: echo "Manifest validation completed"
